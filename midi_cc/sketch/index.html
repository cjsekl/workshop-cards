<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Workshop System</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #fff; overflow: hidden; }
    canvas { display: block; margin: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    #midi-status {
      position: fixed;
      top: 10px;
      left: 10px;
      color: #aaa;
      font: 12px monospace;
      z-index: 10;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
  <div id="midi-status">click to start MIDI</div>
  <script>
// MIDI CC state
const cc = new Array(128).fill(0);
let midiConnected = false;

// Workshop System CC mapping:
//   CC 34 = Main Knob  → animation speed
//   CC 35 = Knob X     → sin fold frequency (horizontal crease density)
//   CC 36 = Knob Y     → cos fold frequency (vertical crease density)
//   CC 37 = Switch      → momentary down toggles: both → pass1 → pass2 → both...
//   CC 38 = Audio In 2  → stroke weight (high pitch = thin, low pitch = thick)
//   CC 39 = Audio In 1  → fold frequency boost (envelope → more creases + slow release)
//   CC 40 = CV In 1    → noise roughness (noiseDetail falloff)
//   CC 41 = CV In 2    → pass coupling / moiré intensity
//   CC 42 = Pulse In 1 → noise time jump (each pulse evolves the pattern)
//   CC 43 = Pulse In 2 → freeze (while high, animation pauses)
//   CC 44 = Card ID     → noise seed (unique per physical card)

function initMIDI() {
  if (!navigator.requestMIDIAccess) {
    document.getElementById('midi-status').textContent = 'WebMIDI not supported';
    return;
  }
  navigator.requestMIDIAccess().then(access => {
    function connectInputs() {
      for (const input of access.inputs.values()) {
        input.onmidimessage = e => {
          if ((e.data[0] & 0xF0) === 0xB0) {
            cc[e.data[1]] = e.data[2];
          }
        };
      }
      midiConnected = access.inputs.size > 0;
      document.getElementById('midi-status').textContent =
        midiConnected ? '' : 'no MIDI device found';
    }
    connectInputs();
    access.onstatechange = connectInputs;
  }).catch(err => {
    document.getElementById('midi-status').textContent = 'MIDI error: ' + err;
  });
}

let noiseTime = 0;
let lastCC42 = 0;
let lastCC43 = 0;
let frozen = false;
let lastCC39 = 0;
let smoothFold = 0;
let seedApplied = false;
let passMode = 0;  // 0=both, 1=pass1 only, 2=pass2 only
let lastCC37 = 0;
const LINE_SPACING = 3;
const X_STEP = 2;
const MARGIN = 50;

function setup() {
  createCanvas(Math.floor(windowWidth * 0.6), Math.floor(windowHeight * 0.6));
  noiseSeed(42);  // default seed, replaced by card ID (CC 44) once MIDI connects
  initMIDI();
}

function windowResized() {
  resizeCanvas(Math.floor(windowWidth * 0.6), Math.floor(windowHeight * 0.6));
}

function draw() {
  // Apply unique noise seed from card ID (CC 44), once received
  if (midiConnected && !seedApplied && cc[44] > 0) {
    noiseSeed(cc[44]);
    seedApplied = true;
  }

  let fold1 = midiConnected ? map(cc[36], 0, 127, 2, 30) : 10;
  let fold2 = midiConnected ? map(cc[35], 0, 127, 2, 30) : 15;
  let roughness = midiConnected ? map(cc[40], 0, 127, 0.1, 0.7) : 0.1;
  let coupling  = midiConnected ? map(cc[41], 0, 127, 0.0, 1.0) : 0.0;
  let speed = midiConnected ? map(cc[34], 0, 127, 0.0, 0.01) : 0.002;
  // Envelope accumulates fold boost — each hit adds, slow decay between hits
  if (midiConnected) {
    let rise = cc[39] - lastCC39;
    if (rise > 0) smoothFold += rise * 0.15;
    lastCC39 = cc[39];
  }
  smoothFold *= 0.99;  // ~3s half-life at 60fps
  fold1 += smoothFold;
  fold2 += smoothFold;
  let scl = 0.003;
  let amp = 80;

  // Noise time jump from pulse input (CC 42)
  if (midiConnected) {
    let rise = cc[42] - lastCC42;
    if (rise > 0) noiseTime += rise * 0.02;
    lastCC42 = cc[42];
  }
  let strokeW = midiConnected ? map(cc[38], 0, 127, 0.7, 0.15) : 0.2;
  // Switch down (CC 37 drops to 0) toggles pass mode: both → pass1 → pass2 → both...
  if (midiConnected) {
    let drop = lastCC37 - cc[37];
    if (drop > 30) passMode = (passMode + 1) % 3;
    lastCC37 = cc[37];
  }
  let showPass1 = !midiConnected || passMode < 2;   // both (0) or pass1 (1)
  let showPass2 = !midiConnected || passMode !== 1;  // both (0) or pass2 (2)

  // Pulse In 2 toggles freeze on each pulse
  if (midiConnected) {
    let rise = cc[43] - lastCC43;
    if (rise > 0) frozen = !frozen;
    lastCC43 = cc[43];
  }

  noiseDetail(6, roughness);
  if (!frozen) noiseTime += speed;

  let w = width - MARGIN * 2;
  let h = height - MARGIN * 2;
  let rows = Math.ceil(h / LINE_SPACING);
  let cols = Math.ceil(w / X_STEP);

  background(255);
  stroke(0);
  strokeWeight(strokeW);

  // Precompute displacement grids (shared by both passes)
  let xDisp = new Array(rows);
  let yDisp = new Array(rows);
  for (let jr = 0; jr < rows; jr++) {
    xDisp[jr] = new Float32Array(cols);
    yDisp[jr] = new Float32Array(cols);
    let jy = jr * LINE_SPACING;
    for (let ic = 0; ic < cols; ic++) {
      let n = noise(ic * X_STEP * scl, jy * scl, noiseTime) * 2 - 1;
      xDisp[jr][ic] = n * amp * sin(10 + n * fold2);
      yDisp[jr][ic] = n * amp * cos(10 + n * fold1);
    }
  }

  let ctx = drawingContext;

  // Pass 1: full noise displacement on both axes
  if (showPass1) {
    ctx.beginPath();
    for (let jr = 0; jr < rows; jr++) {
      let jy = jr * LINE_SPACING + MARGIN;
      ctx.moveTo(xDisp[jr][0] + MARGIN, jy + yDisp[jr][0]);
      for (let ic = 1; ic < cols; ic++) {
        ctx.lineTo(ic * X_STEP + xDisp[jr][ic] + MARGIN, jy + yDisp[jr][ic]);
      }
    }
    ctx.stroke();
  }

  // Pass 2: noise x-displacement, coupled y-displacement (creates moiré with pass 1)
  if (showPass2) {
    let yConst = amp * cos(10 + fold1);
    ctx.beginPath();
    for (let jr = 0; jr < rows; jr++) {
      let jy = jr * LINE_SPACING + MARGIN;
      ctx.moveTo(xDisp[jr][0] + MARGIN, jy + yConst + coupling * (yDisp[jr][0] - yConst));
      for (let ic = 1; ic < cols; ic++) {
        ctx.lineTo(ic * X_STEP + xDisp[jr][ic] + MARGIN, jy + yConst + coupling * (yDisp[jr][ic] - yConst));
      }
    }
    ctx.stroke();
  }

}
  </script>
</body>
</html>
